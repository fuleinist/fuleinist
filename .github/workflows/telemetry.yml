name: telemetry

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch: {}
  # Do NOT add `push`: the job commits its own output, and a push trigger
  # would re-run it forever.

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/telemetry-data.js

      - name: Regenerate dynamic SVGs
        run: node scripts/render.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data.json
          if git diff --quiet --staged; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh telemetry"
          git push