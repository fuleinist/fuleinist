<text x="0" y="16" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#59636e">01 — WHOAMI</text><line x1="0" y1="30" x2="1000" y2="30" stroke="#d1d9e0"/><text x="0" y="62" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#1f2328">full-stack engineer building tooling for ai-assisted development.</text><text x="0" y="88" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#59636e">i ship small, sharp utilities: agent skills, context compression,</text><text x="0" y="114" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#59636e">prompt versioning — and the glue that keeps them honest.</text><text x="0" y="140" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#59636e">typescript / python / rust / go — picked per problem, not per fashion.</text>
